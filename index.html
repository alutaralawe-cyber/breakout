<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    html {
      height: 100%;
      background: #111;
    }

    body {
      margin: 0;
      min-height: 100%;
      padding-block: 16px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    canvas {
      display: block;
      max-width: 100%; /* shrinks to fit narrow screens; the game still runs at 480x400 */
      height: auto;
      background: #000;
      border: 2px solid #444;
      touch-action: none; /* dragging on the canvas moves the paddle instead of scrolling or zooming */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <h1>Breakout</h1>

  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Lives: <span id="lives">3</span></span>
  </div>

  <canvas id="gameCanvas" width="480" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Paddle
    const paddle = {
      width: 80,
      height: 10,
      x: (canvas.width - 80) / 2,
      y: canvas.height - 10 - 20, // 20px above the bottom edge
      speed: 6,
      color: "#4fc3f7",
    };

    // Ball
    const ball = {
      radius: 6,
      x: 0,
      y: 0,
      dx: 0, // horizontal speed (positive = right)
      dy: 0, // vertical speed (negative = up)
      color: "#ffffff",
    };

    // Put the ball back at its starting spot (centered, just above the paddle)
    // heading up and to the right
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = paddle.y - ball.radius - 4;
      ball.dx = 3;
      ball.dy = -3;
    }
    resetBall();

    // Score and lives
    const POINTS_PER_BRICK = 10;
    const STARTING_LIVES = 3;
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    let score = 0;
    let lives = STARTING_LIVES;
    let gameState = "playing"; // "playing", "won" or "lost"

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }
    updateHud();

    // Bricks
    const brickConfig = {
      rows: 4,
      cols: 7,
      height: 18,
      gap: 8,         // space between bricks
      offsetTop: 40,  // space above the first row
      offsetSide: 20, // space left of the first column and right of the last
      rowColors: ["#ef5350", "#ffa726", "#ffee58", "#66bb6a"],
    };
    // Brick width that fills the space between the side offsets: (480 - 40 - 48) / 7 = 56
    brickConfig.width =
      (canvas.width - brickConfig.offsetSide * 2 - brickConfig.gap * (brickConfig.cols - 1)) /
      brickConfig.cols;

    const bricks = [];
    for (let row = 0; row < brickConfig.rows; row++) {
      for (let col = 0; col < brickConfig.cols; col++) {
        bricks.push({
          x: brickConfig.offsetSide + col * (brickConfig.width + brickConfig.gap),
          y: brickConfig.offsetTop + row * (brickConfig.height + brickConfig.gap),
          width: brickConfig.width,
          height: brickConfig.height,
          color: brickConfig.rowColors[row],
          destroyed: false,
        });
      }
    }

    // Keyboard state
    const keys = { left: false, right: false };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        keys.left = true;
        e.preventDefault();
      } else if (e.key === "ArrowRight") {
        keys.right = true;
        e.preventDefault();
      } else if (e.key === " ") {
        e.preventDefault(); // stop Space from scrolling the page
        // Space only restarts from an end screen, never mid-game
        if (gameState !== "playing" && !e.repeat) restartGame();
      }
    });

    // Put everything back to how it was at the start and start the loop again
    function restartGame() {
      for (const brick of bricks) brick.destroyed = false;
      score = 0;
      lives = STARTING_LIVES;
      updateHud();
      paddle.x = (canvas.width - paddle.width) / 2;
      resetBall();
      gameState = "playing";
      requestAnimationFrame(loop);
    }

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      else if (e.key === "ArrowRight") keys.right = false;
    });

    // Touch controls: put a finger on the canvas and the paddle follows it
    // left and right. Tapping the canvas on an end screen starts a new game.
    let activePointerId = null;

    // Convert a screen x position into canvas x, allowing for the canvas
    // being scaled down on narrow screens and for its border
    function toCanvasX(clientX) {
      const rect = canvas.getBoundingClientRect();
      return (clientX - rect.left - canvas.clientLeft) * (canvas.width / canvas.clientWidth);
    }

    function movePaddleTo(clientX) {
      const x = toCanvasX(clientX) - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, x));
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") return; // mouse players use the arrow keys
      e.preventDefault();
      if (gameState !== "playing") {
        restartGame();
        return;
      }
      activePointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId); // keep tracking if the finger slides off the canvas
      movePaddleTo(e.clientX);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (e.pointerId !== activePointerId || gameState !== "playing") return;
      movePaddleTo(e.clientX);
    });

    function releasePointer(e) {
      if (e.pointerId === activePointerId) activePointerId = null;
    }
    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    function update() {
      if (keys.left) paddle.x -= paddle.speed;
      if (keys.right) paddle.x += paddle.speed;

      // Keep the paddle inside the canvas
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      // Move the ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Bounce off the left and right walls
      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
      } else if (ball.x + ball.radius > canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      }

      // Bounce off the top wall
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
      }

      handlePaddleCollision();
      handleBrickCollisions();

      // Win as soon as the last brick is gone
      if (bricks.every((brick) => brick.destroyed)) {
        gameState = "won";
        return;
      }

      handleBallLost();
    }

    // Lose a life once the ball has dropped completely below the canvas
    function handleBallLost() {
      if (ball.y - ball.radius <= canvas.height) return;

      lives--;
      updateHud();

      if (lives <= 0) {
        gameState = "lost";
      } else {
        resetBall();
      }
    }

    // True if the ball's circle overlaps the given rectangle
    function ballHitsRect(rect) {
      const closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.width));
      const closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.height));
      const distX = ball.x - closestX;
      const distY = ball.y - closestY;
      return distX * distX + distY * distY < ball.radius * ball.radius;
    }

    const MAX_BOUNCE_ANGLE = Math.PI / 3; // 60° from vertical at the paddle's edges

    function handlePaddleCollision() {
      // Only bounce while moving down, so the ball can't get caught inside the paddle
      if (ball.dy <= 0 || !ballHitsRect(paddle)) return;

      // Where the ball hit: -1 = left edge, 0 = center, 1 = right edge
      const paddleCenter = paddle.x + paddle.width / 2;
      let hitPos = (ball.x - paddleCenter) / (paddle.width / 2);
      hitPos = Math.max(-1, Math.min(1, hitPos));

      // Keep the same speed, but aim the ball according to where it hit
      const speed = Math.hypot(ball.dx, ball.dy);
      const angle = hitPos * MAX_BOUNCE_ANGLE;
      ball.dx = speed * Math.sin(angle);
      ball.dy = -speed * Math.cos(angle);

      // Put the ball on top of the paddle
      ball.y = paddle.y - ball.radius;
    }

    function handleBrickCollisions() {
      for (const brick of bricks) {
        if (brick.destroyed || !ballHitsRect(brick)) continue;

        brick.destroyed = true;
        score += POINTS_PER_BRICK;
        updateHud();

        // How far the ball overlaps the brick on each axis. The smaller overlap
        // tells us which side it came in from: left/right or top/bottom.
        const overlapX = Math.min(
          ball.x + ball.radius - brick.x,
          brick.x + brick.width - (ball.x - ball.radius)
        );
        const overlapY = Math.min(
          ball.y + ball.radius - brick.y,
          brick.y + brick.height - (ball.y - ball.radius)
        );

        // Send the ball away from the brick. Setting the direction (rather than
        // flipping it) means touching two bricks at once can't cancel the bounce.
        if (overlapX < overlapY) {
          ball.dx = ball.x < brick.x + brick.width / 2 ? -Math.abs(ball.dx) : Math.abs(ball.dx);
        } else {
          ball.dy = ball.y < brick.y + brick.height / 2 ? -Math.abs(ball.dy) : Math.abs(ball.dy);
        }
      }
    }

    function drawBricks() {
      for (const brick of bricks) {
        if (brick.destroyed) continue;
        ctx.fillStyle = brick.color;
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
    }

    function drawPaddle() {
      ctx.fillStyle = paddle.color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
      if (gameState === "won") drawMessage("YOU WIN!", "#66bb6a");
      if (gameState === "lost") drawMessage("GAME OVER", "#ef5350");
    }

    function drawMessage(text, color) {
      ctx.fillStyle = color;
      ctx.font = "bold 32px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 40);
      ctx.fillStyle = "#cccccc";
      ctx.font = "16px system-ui, sans-serif";
      ctx.fillText(`Final score: ${score}`, canvas.width / 2, canvas.height / 2 + 76);
      ctx.fillText("Press Space or tap to play again", canvas.width / 2, canvas.height / 2 + 104);
    }

    function loop() {
      update();
      draw(); // runs once more after the game ends, to show the message

      // Only schedule another frame while the game is still being played
      if (gameState === "playing") {
        requestAnimationFrame(loop);
      }
    }

    loop();
  </script>
</body>
</html>
